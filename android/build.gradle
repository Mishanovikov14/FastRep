buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Reanimated 4.5.x can leave its Prefab configuration task marked up-to-date after
// `clean`, even though the generated package has been removed. Force that small
// configuration task to run so New Architecture clean builds are reproducible.
subprojects { subproject ->
    if (subproject.name == "react-native-reanimated") {
        subproject.tasks.configureEach { task ->
            if (task.name ==~ /^prefab.+ConfigurePackage$/) {
                task.outputs.upToDateWhen { false }
            }
        }
    }
}
